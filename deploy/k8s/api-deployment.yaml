apiVersion: apps/v1
kind: Deployment
metadata:
  name: kepler-api
  labels:
    app: kepler-engine
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kepler-engine
      component: api
  template:
    metadata:
      labels:
        app: kepler-engine
        component: api
    spec:
      serviceAccountName: kepler-engine
      containers:
        - name: api
          image: kepler-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: kepler-engine-config
            - secretRef:
                name: kepler-engine-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
