apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kepler-api-hpa
  labels:
    app: kepler-engine
    component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kepler-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
