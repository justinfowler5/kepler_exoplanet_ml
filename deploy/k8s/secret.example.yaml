# Example Secret — replace values or use External Secrets / IRSA instead of static keys.
apiVersion: v1
kind: Secret
metadata:
  name: kepler-engine-secrets
  labels:
    app: kepler-engine
type: Opaque
stringData:
  KEPLER_REDIS_URL: "redis://kepler-redis:6379/0"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  # Prefer IRSA on EKS; leave these empty when using a service-account role.
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
