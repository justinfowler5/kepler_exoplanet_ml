apiVersion: apps/v1
kind: Deployment
metadata:
  name: kepler-worker
  labels:
    app: kepler-engine
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kepler-engine
      component: worker
  template:
    metadata:
      labels:
        app: kepler-engine
        component: worker
    spec:
      serviceAccountName: kepler-engine
      containers:
        - name: worker
          image: kepler-engine:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - kepler_engine.workers.celery_app
            - worker
            - --loglevel=info
            - --concurrency=1
          envFrom:
            - configMapRef:
                name: kepler-engine-config
            - secretRef:
                name: kepler-engine-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
