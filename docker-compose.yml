services:
  redis:
    image: redis:7-alpine
    ports:
      - "${KEPLER_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "${KEPLER_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${KEPLER_MINIO_HOST_PORT:-9000}:9000"
      - "${KEPLER_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/mlflow-artifacts;
      exit 0;
      "

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    # Host port is overridable because 5000 is a common conflict: a local Docker
    # registry, or AirPlay Receiver on macOS, will already hold it. Only the host
    # side moves; in-cluster clients keep using mlflow:5000.
    ports:
      - "${KEPLER_MLFLOW_HOST_PORT:-5000}:5000"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        pip install --no-cache-dir psycopg2-binary boto3
        && mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
        --artifacts-destination s3://mlflow-artifacts
        --serve-artifacts
        --allowed-hosts '*'
        --cors-allowed-origins '*'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  api:
    image: kepler-engine:local
    build:
      context: .
      dockerfile: Dockerfile
      # Compose v2 builds through Buildx/BuildKit. Prefer `.\tasks.ps1 build`
      # (docker-bake.hcl) when building outside Compose.
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      KEPLER_ENV: local
      KEPLER_LOG_LEVEL: INFO
      KEPLER_DATA_SOURCE: local_csv
      KEPLER_LOCAL_CSV_PATH: data/samples/kepler_koi_sample.csv
      KEPLER_REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      KEPLER_MLFLOW_EXPERIMENT_NAME: kepler-koi
      KEPLER_REGISTERED_MODEL_NAME: kepler-koi-classifier
      KEPLER_MODEL_ALIAS: champion
      KEPLER_PROMOTE_METRIC: f1
      KEPLER_PROMOTE_THRESHOLD: "0.50"
    ports:
      - "${KEPLER_API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    image: kepler-engine:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      KEPLER_ENV: local
      KEPLER_LOG_LEVEL: INFO
      KEPLER_DATA_SOURCE: local_csv
      KEPLER_LOCAL_CSV_PATH: data/samples/kepler_koi_sample.csv
      KEPLER_REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      KEPLER_MLFLOW_EXPERIMENT_NAME: kepler-koi
      KEPLER_REGISTERED_MODEL_NAME: kepler-koi-classifier
      KEPLER_MODEL_ALIAS: champion
      KEPLER_PROMOTE_METRIC: f1
      KEPLER_PROMOTE_THRESHOLD: "0.50"
      KEPLER_WORKER_METRICS_PORT: "9100"
    ports:
      - "${KEPLER_WORKER_METRICS_HOST_PORT:-9100}:9100"
    entrypoint: ["celery"]
    command:
      - "-A"
      - "kepler_engine.workers.celery_app"
      - "worker"
      - "--loglevel=info"
      - "--concurrency=1"
      - "--pool=solo"
    healthcheck:
      disable: true

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started
    ports:
      - "${KEPLER_PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:12.1.0
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${KEPLER_GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  pgdata:
  miniodata:
  prometheusdata:
  grafanadata:
