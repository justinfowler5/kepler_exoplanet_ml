services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/mlflow-artifacts;
      exit 0;
      "

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "5000:5000"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        pip install --no-cache-dir psycopg2-binary boto3
        && mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
        --artifacts-destination s3://mlflow-artifacts
        --serve-artifacts
        --allowed-hosts '*'
        --cors-allowed-origins '*'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  api:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      KEPLER_ENV: local
      KEPLER_LOG_LEVEL: INFO
      KEPLER_DATA_SOURCE: local_csv
      KEPLER_LOCAL_CSV_PATH: data/samples/kepler_koi_sample.csv
      KEPLER_REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      KEPLER_MLFLOW_EXPERIMENT_NAME: kepler-koi
      KEPLER_REGISTERED_MODEL_NAME: kepler-koi-classifier
      KEPLER_MODEL_ALIAS: champion
      KEPLER_PROMOTE_METRIC: f1
      KEPLER_PROMOTE_THRESHOLD: "0.50"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      KEPLER_ENV: local
      KEPLER_LOG_LEVEL: INFO
      KEPLER_DATA_SOURCE: local_csv
      KEPLER_LOCAL_CSV_PATH: data/samples/kepler_koi_sample.csv
      KEPLER_REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      KEPLER_MLFLOW_EXPERIMENT_NAME: kepler-koi
      KEPLER_REGISTERED_MODEL_NAME: kepler-koi-classifier
      KEPLER_MODEL_ALIAS: champion
      KEPLER_PROMOTE_METRIC: f1
      KEPLER_PROMOTE_THRESHOLD: "0.50"
    entrypoint: ["celery"]
    command:
      - "-A"
      - "kepler_engine.workers.celery_app"
      - "worker"
      - "--loglevel=info"
      - "--concurrency=1"
    healthcheck:
      disable: true

volumes:
  pgdata:
  miniodata:
